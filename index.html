<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trap Runner</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  #game {
    display: block;
    margin: auto;
    background: #8ed6ff;
    image-rendering: pixelated;
  }

  #ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    font-size: 18px;
    text-shadow: 2px 2px #000;
  }

  #message {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 3px 3px #000;
  }

  .hint {
    position: fixed;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: #ddd;
  }
</style>
</head>

<body>

<div id="ui">
  Nível: <span id="level">1</span> |
  Mortes: <span id="deaths">0</span>
</div>

<div id="message"></div>

<canvas id="game" width="900" height="500"></canvas>

<div class="hint">
  ← → / A D para andar • Espaço para pular • R para reiniciar
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const levelText = document.getElementById("level");
const deathText = document.getElementById("deaths");
const message = document.getElementById("message");

const gravity = 0.7;
const speed = 4.5;
const jump = -12;

let keys = {};
let deaths = 0;
let level = 0;
let won = false;

const levels = [
  {
    spawn: {x: 50, y: 400},
    goal: {x: 820, y: 410, w: 35, h: 50},
    platforms: [
      {x: 0, y: 450, w: 900, h: 50},
      {x: 180, y: 360, w: 130, h: 20},
      {x: 400, y: 300, w: 130, h: 20},
      {x: 620, y: 360, w: 120, h: 20}
    ],
    traps: [
      {x: 315, y: 430, w: 55, h: 20},
      {x: 540, y: 430, w: 80, h: 20}
    ]
  },

  {
    spawn: {x: 50, y: 400},
    goal: {x: 820, y: 210, w: 35, h: 50},
    platforms: [
      {x: 0, y: 450, w: 180, h: 50},
      {x: 250, y: 450, w: 130, h: 50},
      {x: 450, y: 380, w: 120, h: 20},
      {x: 650, y: 300, w: 120, h: 20},
      {x: 780, y: 260, w: 120, h: 20}
    ],
    traps: [
      {x: 180, y: 430, w: 70, h: 20},
      {x: 380, y: 430, w: 70, h: 20},
      {x: 570, y: 430, w: 70, h: 20}
    ]
  },

  {
    spawn: {x: 50, y: 400},
    goal: {x: 820, y: 400, w: 35, h: 50},
    platforms: [
      {x: 0, y: 450, w: 900, h: 50},
      {x: 100, y: 350, w: 100, h: 20},
      {x: 300, y: 280, w: 100, h: 20},
      {x: 500, y: 350, w: 100, h: 20},
      {x: 700, y: 280, w: 100, h: 20}
    ],
    traps: [
      {x: 200, y: 430, w: 100, h: 20},
      {x: 600, y: 430, w: 100, h: 20}
    ]
  }
];

let player = {
  x: 0,
  y: 0,
  w: 30,
  h: 40,
  vx: 0,
  vy: 0,
  grounded: false
};

function loadLevel() {
  const l = levels[level];

  player.x = l.spawn.x;
  player.y = l.spawn.y;
  player.vx = 0;
  player.vy = 0;

  won = false;
  message.textContent = "";
  levelText.textContent = level + 1;
}

function reset() {
  loadLevel();
}

function die() {
  deaths++;
  deathText.textContent = deaths;

  message.textContent = "💀";
  
  setTimeout(() => {
    loadLevel();
  }, 500);
}

function nextLevel() {
  level++;

  if (level >= levels.length) {
    won = true;
    message.textContent = "VOCÊ VENCEU! 🎉";
    return;
  }

  message.textContent = "NÍVEL " + (level + 1);

  setTimeout(() => {
    loadLevel();
  }, 700);
}

function collide(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update() {
  if (won) return;

  const l = levels[level];

  player.vx = 0;

  if (keys["ArrowLeft"] || keys["a"]) {
    player.vx = -speed;
  }

  if (keys["ArrowRight"] || keys["d"]) {
    player.vx = speed;
  }

  if (
    (keys[" "] || keys["ArrowUp"] || keys["w"]) &&
    player.grounded
  ) {
    player.vy = jump;
    player.grounded = false;
  }

  player.vy += gravity;

  player.x += player.vx;

  // Limites da tela
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width)
    player.x = canvas.width - player.w;

  const oldY = player.y;

  player.y += player.vy;
  player.grounded = false;

  // Plataformas
  for (const p of l.platforms) {
    if (collide(player, p)) {

      // Somente pouso pela parte superior
      if (
        oldY + player.h <= p.y &&
        player.vy >= 0
      ) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  // Espinhos / armadilhas
  for (const trap of l.traps) {
    if (collide(player, trap)) {
      die();
      return;
    }
  }

  // Caiu fora do mapa
  if (player.y > canvas.height + 100) {
    die();
    return;
  }

  // Objetivo
  if (collide(player, l.goal)) {
    nextLevel();
  }
}

function drawPlayer() {
  ctx.fillStyle = "#222";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Olhos
  ctx.fillStyle = "white";
  ctx.fillRect(player.x + 7, player.y + 8, 5, 5);
  ctx.fillRect(player.x + 19, player.y + 8, 5, 5);
}

function draw() {
  const l = levels[level];

  // Fundo
  ctx.fillStyle = "#8ed6ff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Nuvens decorativas
  ctx.fillStyle = "rgba(255,255,255,.7)";
  ctx.fillRect(100, 80, 120, 25);
  ctx.fillRect(150, 65, 60, 30);
  ctx.fillRect(600, 100, 140, 25);

  // Plataformas
  for (const p of l.platforms) {
    ctx.fillStyle = "#3b3b3b";
    ctx.fillRect(p.x, p.y, p.w, p.h);

    ctx.fillStyle = "#555";
    ctx.fillRect(p.x, p.y, p.w, 5);
  }

  // Armadilhas
  for (const trap of l.traps) {
    ctx.fillStyle = "#e33";

    const count = Math.floor(trap.w / 15);

    for (let i = 0; i < count; i++) {
      const x = trap.x + i * 15;

      ctx.beginPath();
      ctx.moveTo(x, trap.y + trap.h);
      ctx.lineTo(x + 7.5, trap.y);
      ctx.lineTo(x + 15, trap.y + trap.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Objetivo
  ctx.fillStyle = "#20c878";
  ctx.fillRect(
    l.goal.x,
    l.goal.y,
    l.goal.w,
    l.goal.h
  );

  ctx.fillStyle = "white";
  ctx.fillRect(
    l.goal.x + 8,
    l.goal.y + 8,
    19,
    8
  );

  drawPlayer();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

window.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (e.key.toLowerCase() === "r") {
    reset();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key] = false;
});

loadLevel();
gameLoop();
</script>

</body>
</html>
