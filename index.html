
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teen Wolf — Player</title>


  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }


    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 5%;
      background: #111;
      border-bottom: 1px solid #292929;
    }


    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #e50914;
    }


    nav {
      margin-left: auto;
    }


    nav a {
      color: #ddd;
      text-decoration: none;
      margin-left: 25px;
    }


    nav a:hover {
      color: white;
    }


    .hero {
      min-height: 430px;
      padding: 70px 8%;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, #080808 20%, rgba(8,8,8,.65), rgba(8,8,8,.15)),
        linear-gradient(0deg, #080808, transparent);
    }


    .hero-content {
      max-width: 650px;
    }


    .hero h1 {
      font-size: 58px;
      margin-bottom: 15px;
    }


    .hero p {
      color: #ccc;
      line-height: 1.6;
      font-size: 17px;
    }


    .player-section {
      width: 90%;
      max-width: 1100px;
      margin: -20px auto 50px;
      position: relative;
    }


    video {
      width: 100%;
      display: block;
      background: black;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,.6);
    }



Estrutura das pastas:

teen-wolf/
├── index.html
├── capa.jpg
└── videos/
    ├── episodio-01.mp4
    ├── episodio-02.mp4
    ├── episodio-03.mp4
    ├── t2-episodio-01.mp4
    └── t2-episodio-02.mp4

Assim, ao clicar em um episódio, o player troca automaticamente para o vídeo correspondente.
